{% extends "base.html" %}

{% block title %}Chat with Owner - Resident Portal{% endblock %}

{% block content %}
<div class="bento-grid" style="margin-top: 1rem; height: calc(100vh - 180px); justify-content: center; gap: 1.25rem;">
    <!-- Conversation Window -->
    <div class="bento-card glass-minimal col-8" style="display: flex; flex-direction: column; padding: 0; overflow: hidden; height: 100%; margin: 0 auto; max-width: 800px; width: 100%;">
        <!-- Chat Header -->
        <div style="padding: 1rem 1.5rem; border-bottom: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.01);">
            <div style="display: flex; align-items: center; gap: 0.75rem;">
                <div style="font-size: 1.5rem; filter: drop-shadow(0 0 5px var(--primary-glow));">👤</div>
                <div>
                    <h4 style="margin: 0; font-size: 1.15rem; color: var(--text-primary);">Owner Manager ({{ owner.email }})</h4>
                    <span style="font-size: 0.85rem; color: var(--text-secondary);">🏢 Hostel: {{ resident.hostel.hostel_name }} — Rm {{ resident.room_number }}</span>
                </div>
            </div>
        </div>

        <!-- Messages Window -->
        <div style="flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; background: rgba(0,0,0,0.08);" id="chat-messages-container">
            <!-- Message Bubbles Dynamically Loaded -->
        </div>

        <!-- Bottom Inputs Area -->
        <div style="padding: 1rem 1.5rem; border-top: 1px solid var(--glass-border); background: rgba(255,255,255,0.01);">
            <form id="chat-send-form" onsubmit="sendMessage(event)" style="display: flex; gap: 0.75rem; align-items: center;">
                <input type="text" id="chat-input" class="form-control tactile-inset" placeholder="Type a message to your hostel owner..." required autocomplete="off" style="width: 100%; padding: 0.8rem 1.2rem; font-size: 0.95rem;">
                <button type="submit" class="btn btn-primary clay-btn" style="padding: 0.8rem 1.5rem; display: flex; align-items: center; gap: 0.25rem;">
                    <span>Send</span> ➔
                </button>
            </form>
        </div>
    </div>
</div>

<style>
    .chat-bubble {
        max-width: 70%;
        padding: 0.75rem 1rem;
        border-radius: 16px;
        font-size: 0.92rem;
        line-height: 1.4;
        word-break: break-word;
        position: relative;
    }
    
    .chat-bubble.sent {
        align-self: flex-end;
        background: linear-gradient(135deg, var(--primary) 0%, #0369a1 100%);
        color: white;
        border-bottom-right-radius: 4px;
        box-shadow: 0 4px 10px rgba(2, 132, 199, 0.25);
    }
    
    .chat-bubble.received {
        align-self: flex-start;
        background: var(--glass-bg-card);
        color: var(--text-primary);
        border: 1px solid var(--glass-border);
        border-bottom-left-radius: 4px;
        box-shadow: var(--shadow-sm);
    }
    
    .chat-bubble-time {
        font-size: 0.7rem;
        display: block;
        text-align: right;
        margin-top: 0.25rem;
        opacity: 0.75;
    }
</style>
{% endblock %}

{% block extra_js %}
<script>
    const ownerUserId = {{ owner.id }};
    let pollInterval = null;

    document.addEventListener('DOMContentLoaded', () => {
        const container = document.getElementById('chat-messages-container');
        container.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:2rem;">Loading chat history...</div>';
        
        loadMessages();
        
        // Poll for new messages every 3 seconds
        pollInterval = setInterval(loadMessages, 3000);
    });

    function loadMessages() {
        fetch(`/api/chat/messages/${ownerUserId}`)
            .then(res => res.json())
            .then(messages => {
                const container = document.getElementById('chat-messages-container');
                const wasAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 40;
                
                container.innerHTML = '';
                
                if (messages.length === 0) {
                    container.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:3rem 0;">No messages yet. Send a greeting to your owner! 👋</div>';
                    return;
                }
                
                messages.forEach(m => {
                    const directionClass = m.sender_id === ownerUserId ? 'received' : 'sent';
                    container.innerHTML += `
                        <div class="chat-bubble ${directionClass}">
                            ${escapeHTML(m.message_content)}
                            <span class="chat-bubble-time">${m.created_at}</span>
                        </div>
                    `;
                });
                
                if (wasAtBottom) {
                    container.scrollTop = container.scrollHeight;
                }
            })
            .catch(err => console.error("Error loading chat messages", err));
    }

    function sendMessage(event) {
        event.preventDefault();
        const input = document.getElementById('chat-input');
        const content = input.value.trim();
        if (!content) return;

        input.value = '';

        fetch(`/api/chat/messages/${ownerUserId}`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token() }}'
            },
            body: JSON.stringify({ message_content: content })
        })
        .then(res => res.json())
        .then(msg => {
            const container = document.getElementById('chat-messages-container');
            if (container.innerText.includes('No messages')) {
                container.innerHTML = '';
            }
            
            container.innerHTML += `
                <div class="chat-bubble sent">
                    ${escapeHTML(msg.message_content)}
                    <span class="chat-bubble-time">${msg.created_at}</span>
                </div>
            `;
            
            container.scrollTop = container.scrollHeight;
        })
        .catch(err => {
            console.error("Failed to send message", err);
            alert("Error sending message. Please try again.");
        });
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag)
        );
    }
</script>
{% endblock %}
