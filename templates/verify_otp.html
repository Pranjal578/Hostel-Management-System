{% extends "base.html" %}

{% block title %}Verify OTP - Hostel Management System{% endblock %}

{% block content %}
<style>
    .otp-input {
        letter-spacing: 10px;
        font-size: 24px;
        text-align: center;
        font-weight: bold;
    }

    .otp-timer {
        text-align: center;
        font-size: 18px;
        font-weight: bold;
        color: #007bff;
        margin: 15px 0;
    }

    .otp-timer.warning {
        color: #ff6b6b;
    }
</style>

<div class="container">
    <div class="card" style="max-width: 500px; margin: 4rem auto;">
        <div class="card-header text-center">
            <div style="font-size: 4rem; margin-bottom: 1rem;">🔐</div>
            <h2>Enter OTP Code</h2>
            <p style="color: var(--text-secondary); margin: 0;">We sent a 6-digit code to your account</p>
        </div>

        <div class="card-body">
            <form method="POST" action="{{ url_for('verify_otp') }}" id="otpForm">
                <div class="form-group">
                    <label for="otp_code">OTP Code</label>
                    <input type="text" class="form-control otp-input" id="otp_code" name="otp_code"
                           placeholder="000000" maxlength="6" required autofocus
                           inputmode="numeric" pattern="[0-9]{6}">
                </div>

                <div class="otp-timer" id="timer">
                    ⏱️ {{ remaining_time.display }} remaining
                </div>

                <div class="form-group">
                    <button type="submit" class="btn btn-primary btn-lg btn-block">
                        Verify OTP
                    </button>
                </div>
            </form>

            <div class="text-center" style="margin-top: 1.5rem; border-top: 1px solid #eee; padding-top: 1.5rem;">
                <p style="color: var(--text-secondary); margin-bottom: 10px;">
                    Didn't receive the code?
                </p>
                <form method="POST" action="{{ url_for('resend_otp') }}" style="display: inline;">
                    <button type="submit" class="btn btn-outline-secondary btn-sm">
                        Resend OTP
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // Auto-format input (only accept digits)
    const otpInput = document.getElementById('otp_code');
    otpInput.addEventListener('input', function (e) {
        this.value = this.value.replace(/[^0-9]/g, '').substring(0, 6);
    });

    // Auto-submit when 6 digits entered
    otpInput.addEventListener('input', function (e) {
        if (this.value.length === 6) {
            // Optional: auto-submit form
            // document.getElementById('otpForm').submit();
        }
    });

    // Timer countdown (frontend countdown matching backend time)
    let remainingSeconds = {{ remaining_time.seconds }};
    const timerEl = document.getElementById('timer');

    function updateTimer() {
        if (remainingSeconds <= 0) {
            timerEl.innerHTML = '⏱️ 0:00 - OTP Expired';
            timerEl.classList.add('warning');
            otpInput.disabled = true;
            return;
        }

        const minutes = Math.floor(remainingSeconds / 60);
        const seconds = remainingSeconds % 60;
        const display = `${minutes}:${seconds.toString().padStart(2, '0')}`;

        if (remainingSeconds < 120) {
            timerEl.classList.add('warning');
        }

        timerEl.innerHTML = `⏱️ ${display} remaining`;
        remainingSeconds--;

        setTimeout(updateTimer, 1000);
    }

    updateTimer();
</script>
{% endblock %}
