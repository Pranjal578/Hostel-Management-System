{% extends "base.html" %}

{% block title %}Admin Login - Hostel Management System{% endblock %}

{% block content %}
<div class="container">
    <div class="card" style="max-width: 500px; margin: 4rem auto;">
        <div class="card-header text-center">
            <div style="font-size: 4rem; margin-bottom: 1rem;">👮‍♂️</div>
            <h2>Admin Access</h2>
            <p style="color: var(--text-secondary); margin: 0;">Authorized personnel only</p>
        </div>
        
        <div class="card-body">
            <form method="POST" action="{{ url_for('admin_login') }}">
                <div class="form-group">
                    <label for="username">Admin Username</label>
                    <input type="text" class="form-control" id="username" name="username" required placeholder="Enter admin username" autofocus>
                </div>
                
                <div class="form-group">
                    <label for="password">Admin Password</label>
                    <input type="password" class="form-control" id="password" name="password" required placeholder="Enter admin password">
                </div>
                
                <div class="form-group">
                    <button type="submit" class="btn btn-danger btn-lg btn-block">
                        🔐 Admin Login
                    </button>
                </div>
            </form>
            
            <div style="background: #fff3cd; padding: 1rem; border-radius: var(--radius); margin-top: 1.5rem; border-left: 4px solid #ffc107;">
                <p style="margin: 0; color: #856404; font-size: 0.875rem;">
                    <strong>⚠️ Demo Credentials:</strong><br>
                    Username: <code>admin</code><br>
                    Password: <code>admin123</code>
                </p>
            </div>
            
            <div class="text-center" style="margin-top: 1.5rem;">
                <p style="color: var(--text-secondary);">
                    <a href="{{ url_for('index') }}">← Back to Home</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
