name: roommet_flutter
description: "ROOMMET Hostel Management Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.1

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.1

  # Secure Storage (JWT token)
  flutter_secure_storage: ^9.2.2

  # Local Caching (Offline support)
  hive_flutter: ^1.1.0

  # UI — Skeleton Loading
  shimmer: ^3.0.0

  # QR Code Display
  qr_flutter: ^4.1.0

  # QR Scanner (Owner camera)
  mobile_scanner: ^5.2.3

  # Image & File Picker
  image_picker: ^1.1.2
  file_picker: ^8.1.7

  # Google Fonts
  google_fonts: ^6.2.1

  # Charts (Admin dashboard)
  fl_chart: ^0.69.0

  # Cached network images
  cached_network_image: ^3.4.1

  # URL launcher
  url_launcher: ^6.3.1

  # Date formatting
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.8

  # Google Sign-in SSO authentication
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
